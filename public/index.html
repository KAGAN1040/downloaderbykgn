<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video İndirici</title>
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#101a33;--mute:#5d6a86;--line:#d5dcec;--acc:#2447f5;--accink:#fff;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0c1224;--card:#141c34;--ink:#e8edfb;--mute:#93a0c0;--line:#27324f;--acc:#6f8bff;--accink:#0c1224;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:start center;padding:8vh 16px 40px}
main{width:100%;max-width:640px}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.03em}
.sub{color:var(--mute);margin:0 0 28px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 240px;min-width:0;padding:14px 16px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px}
input:focus,button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button,select{font:inherit;border-radius:12px;cursor:pointer}
.go{padding:14px 22px;border:0;background:var(--acc);color:var(--accink);font-weight:700}
.go:disabled{opacity:.5;cursor:wait}
.ghost{padding:14px 16px;background:transparent;color:var(--ink);border:2px solid var(--line)}
#msg{min-height:1.5em;margin:12px 2px;color:var(--mute)}
#msg.err{color:var(--err)}
#card{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
#head{display:flex;gap:14px;align-items:center}
#thumb{width:112px;aspect-ratio:16/10;object-fit:cover;border-radius:10px;background:var(--line);flex:none}
#title{font-weight:700;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#meta{color:var(--mute);font-size:.9rem}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-weight:600;margin-bottom:8px;color:var(--mute);font-size:.9rem}
.fmts{display:flex;gap:8px;flex-wrap:wrap}
.fmts label{position:relative}
.fmts input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;flex:none}
.fmts span{display:block;padding:9px 16px;border:2px solid var(--line);border-radius:999px;font-weight:600}
.fmts input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.fmts input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
select{padding:10px 12px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
#dl{width:100%;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>Linki yapıştır, indir.</h1>
  <p class="sub">TikTok, Instagram, YouTube, X ve Reddit videoları. MP4, MP3 ve daha fazlası.</p>

  <div class="row">
    <input id="url" type="url" placeholder="Video linkini buraya yapıştır" autocomplete="off" aria-label="Video linki">
    <button class="ghost" id="paste" type="button">Yapıştır</button>
    <button class="go" id="fetch" type="button">Videoyu getir</button>
  </div>
  <div id="msg" role="status"></div>

  <section id="card">
    <div id="head">
      <img id="thumb" alt="" referrerpolicy="no-referrer">
      <div><div id="title"></div><div id="meta"></div></div>
    </div>
    <fieldset><legend>Video</legend><div class="fmts" id="vf"></div></fieldset>
    <fieldset><legend>Sadece ses</legend><div class="fmts" id="af"></div></fieldset>
    <fieldset id="qwrap"><legend>Kalite</legend><select id="q" aria-label="Kalite"></select></fieldset>
    <button class="go" id="dl" type="button">İndir</button>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const VF = ['mp4','webm','mkv'], AF = ['mp3','m4a','wav','opus','flac'];
let current = '';

function build(box, list, checked){
  box.innerHTML = list.map(f => `<label><input type="radio" name="fmt" value="${f}" ${f===checked?'checked':''}><span>${f.toUpperCase()}</span></label>`).join('');
}
build($('vf'), VF, 'mp4'); build($('af'), AF);
document.addEventListener('change', e => {
  if (e.target.name === 'fmt') $('qwrap').style.display = AF.includes(e.target.value) ? 'none' : '';
});

function say(t, err){ $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }
function dur(s){ if(!s) return ''; const m=Math.floor(s/60); return m+':'+String(Math.round(s%60)).padStart(2,'0'); }

$('paste').onclick = async () => {
  try { $('url').value = await navigator.clipboard.readText(); $('url').focus(); }
  catch { say('Panoya erişilemedi. Linki elle yapıştır.', true); }
};

async function getInfo(){
  const url = $('url').value.trim();
  if (!url) return say('Önce bir link gir.', true);
  $('fetch').disabled = true; $('card').style.display = 'none'; say('Video bilgisi alınıyor…');
  try {
    const r = await fetch('/api/info', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    current = url;
    $('thumb').src = d.thumbnail || '';
    $('title').textContent = d.title || 'Başlıksız video';
    $('meta').textContent = [d.uploader, dur(d.duration)].filter(Boolean).join(' • ');
    const hs = d.heights.length ? d.heights : [1080, 720, 480, 360];
    $('q').innerHTML = '<option value="4320">En yüksek</option>' + hs.map(h => `<option value="${h}">${h}p</option>`).join('');
    $('card').style.display = 'block'; say('');
  } catch(e){ say(e.message || 'Bir hata oluştu.', true); }
  $('fetch').disabled = false;
}
$('fetch').onclick = getInfo;
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') getInfo(); });

$('dl').onclick = async () => {
  const fmt = document.querySelector('input[name=fmt]:checked');
  if (!fmt) return say('Bir format seç.', true);
  const qs = new URLSearchParams({url: current, format: fmt.value, q: $('q').value});
  $('dl').disabled = true; say('Hazırlanıyor, uzun videolarda biraz sürebilir…');
  try {
    const r = await fetch('/api/download?' + qs);
    if (!r.ok) throw new Error(await r.text());
    const cd = r.headers.get('Content-Disposition') || '';
    const m = /filename\*=UTF-8''([^;]+)/i.exec(cd) || /filename="?([^";]+)/i.exec(cd);
    const name = m ? decodeURIComponent(m[1]) : 'video.' + fmt.value;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob()); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    say('İndirme başladı.');
  } catch(e){ say(e.message || 'İndirme başarısız.', true); }
  $('dl').disabled = false;
};
</script>
</body>
</html>
